<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self'; font-src 'self' file:">
  <title>OrbitVisuals</title>
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <main>
    <section class="glass" aria-label="Запуск игры">
      <img class="logo" src="../src/main/resources/assets/orbitdlc/black_hole.png" alt="">
      <h1>OrbitVisuals</h1>
      <p class="version">Minecraft 26.3 <span>·</span> Fabric</p>
      <button class="play" type="button"><span aria-hidden="true">▶</span> Играть</button>
      <p class="status" role="status"><i></i><span>Готов к запуску</span></p>
      <details>
        <summary>Журнал запуска</summary>
        <pre tabindex="0">Журнал появится после запуска игры.</pre>
      </details>
    </section>
  </main>
</body>
</html>
